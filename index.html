<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Puzzles</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0e0e11;
    --text: #f5f5f7;
    --dim: #8a8a96;
    --line: #22222a;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* 760px keeps a 2-up card near ~355px — wider and the tiles look stretched */
  .wrap { max-width: 760px; margin: 0 auto; padding: 4rem 1.25rem 5rem; }

  /* ── header ── */
  .bar { display: flex; align-items: flex-end; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
  h1 {
    font-size: clamp(2.4rem, 9vw, 4.2rem);
    font-weight: 800;
    letter-spacing: -.045em;
    line-height: .92;
    text-transform: uppercase;
  }
  .sub { color: var(--dim); margin-top: .6rem; font-size: .95rem; font-weight: 500; }

  button {
    font: inherit;
    font-size: .82rem;
    font-weight: 600;
    color: var(--dim);
    background: none;
    border: 1.5px solid var(--line);
    border-radius: 8px;
    padding: .45rem .85rem;
    cursor: pointer;
    transition: color .15s, border-color .15s;
  }
  button:hover { color: var(--text); border-color: #3a3a46; }

  /* ── edit panel ── */
  #panel { margin-top: 1.5rem; padding: 1rem; background: #15151a; border: 1.5px solid var(--line); border-radius: 12px; }
  #json {
    width: 100%;
    min-height: 220px;
    resize: vertical;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: .8rem;
    line-height: 1.55;
    color: var(--text);
    background: #0b0b0e;
    border: 1.5px solid var(--line);
    border-radius: 8px;
    padding: .75rem;
    tab-size: 2;
  }
  #json:focus { outline: 2px solid #6366f1; outline-offset: 1px; }
  .acts { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; margin-top: .75rem; }
  #status { font-size: .8rem; font-weight: 600; color: #4ade80; }
  #status[data-bad="1"] { color: #f87171; }
  .hint { font-size: .78rem; color: var(--dim); margin-top: .75rem; line-height: 1.55; }
  .hint code { font-family: ui-monospace, Menlo, monospace; color: #b4b4c4; }

  /* ── grid ── */
  .grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));   /* 2 columns at every width */
    gap: .75rem;
    margin-top: 2rem;
  }

  .card {
    position: relative;
    display: block;
    min-height: 150px;
    padding: 1.15rem;
    background: var(--c);
    border-radius: 14px;
    text-decoration: none;
    color: #fff;
    overflow: hidden;
    transition: transform .16s ease, filter .16s ease;
  }
  .card:hover { transform: translateY(-3px); filter: brightness(1.14); }
  .card:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }

  /* oversized emoji watermark, bottom-right */
  .icon {
    position: absolute;
    right: -.4rem;
    bottom: -1.1rem;
    font-size: 4.6rem;
    line-height: 1;
    opacity: .2;
    pointer-events: none;
    transition: opacity .16s, transform .16s;
  }
  .card:hover .icon { opacity: .3; transform: scale(1.06) rotate(-4deg); }

  .body { position: relative; display: block; }
  .name {
    display: block;
    font-size: 1.22rem;
    font-weight: 700;
    letter-spacing: -.02em;
    line-height: 1.15;
    text-transform: uppercase;
  }
  .desc {
    display: block;
    font-size: .84rem;
    font-weight: 500;
    line-height: 1.4;
    margin-top: .45rem;
    color: rgba(255,255,255,.78);
    max-width: 85%;
  }
  .go {
    position: absolute;
    left: 1.15rem;
    bottom: 1.05rem;
    font-size: 1.15rem;
    font-weight: 700;
    transition: transform .16s;
  }
  .card:hover .go { transform: translateX(5px); }

  footer { margin-top: 2.5rem; font-size: .8rem; color: var(--dim); }

  /* 2-up on a phone leaves ~170px per card — tighten so titles stop wrapping to 3 lines */
  @media (max-width: 520px) {
    .wrap { padding: 2.5rem .85rem 3.5rem; }
    .grid { gap: .55rem; }
    .card { min-height: 132px; padding: .85rem; border-radius: 12px; }
    .name { font-size: 1rem; }
    .desc { font-size: .75rem; max-width: 100%; }
    .icon { font-size: 3.4rem; bottom: -.8rem; right: -.3rem; }
    .go { left: .85rem; bottom: .75rem; font-size: 1rem; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="bar">
        <div>
          <h1>Daily<br>Puzzles</h1>
          <p class="sub"><span id="count"></span> games &middot; pick one, go</p>
        </div>
        <button id="editBtn">Edit list</button>
      </div>

      <div id="panel" hidden>
        <textarea id="json" spellcheck="false" aria-label="Game list as JSON"></textarea>
        <div class="acts">
          <button id="save">Save</button>
          <button id="copy">Copy list</button>
          <button id="reset">Reset</button>
          <span id="status" role="status"></span>
        </div>
        <p class="hint">
          One object per game: <code>name</code>, <code>desc</code>, <code>url</code>, <code>icon</code>,
          optional <code>color</code> (use a dark hex &mdash; the tile text is white).
          Saved in this browser only &mdash; hit <strong>Copy list</strong> and send the JSON to a friend
          to share your edits.
        </p>
      </div>
    </header>

    <main class="grid" id="grid"></main>

    <footer>Stored in this browser. Most puzzles reset at local midnight.</footer>
  </div>

<script>
const DEFAULT_GAMES = [
  { name: "Wordle",               desc: "Guess the 5-letter word in 6 tries",     url: "https://www.nytimes.com/games/wordle/index.html", icon: "🟩" },
  { name: "India Mini Crossword", desc: "Quick crossword with an Indian twist",   url: "https://indiamini.in/play/?show=all",             icon: "🇮🇳" },
  { name: "Hindu Mini Crossword", desc: "The Hindu's daily mini crossword",       url: "https://www.thehindu.com/crosswords/thehindu-mini-crossword", icon: "📰" },
  { name: "References",           desc: "Find the hidden connections",           url: "https://referencesgame.com/",                     icon: "🔗" },
  { name: "Krilllion",            desc: "Are you one in a krillion?",            url: "https://krillion.io/",                            icon: "🦐" },
  { name: "Enclose Horse",        desc: "Build an enclosure around the horse",   url: "https://enclose.horse/",                          icon: "🐎" },
  { name: "Foximax",              desc: "Recursive Wordle",                      url: "https://foximax.com/",                            icon: "🦊" },
  { name: "4x3",                  desc: "Connections, but free",                 url: "https://www.hankgreen.com/fourbythree/",          icon: "🔢" },
  { name: "Chainle",              desc: "Keep the chain going",                  url: "https://chainle.io/",                             icon: "⛓️" },
  { name: "Verticle",             desc: "Vertical Wordle",                       url: "https://verticle.netlify.app/",                   icon: "🔃" },
  { name: "Geozee",               desc: "Place 9 countries into 9 categories",   url: "https://geozee.earth/",                           icon: "🌍" }
];

const KEY = "dailyPuzzles.games";
// Deep/saturated only — tile text is white, so these have to stay dark for contrast.
const PALETTE = ["#166534","#9a3412","#075985","#6b21a8","#854d0e","#9d174d","#155e75","#991b1b","#3f6212","#1e40af","#86198f"];

const $ = s => document.querySelector(s);
const grid = $("#grid");

// Only http(s) — keeps a pasted javascript: URL from becoming a live link.
const httpOnly = u => /^https?:\/\//i.test(String(u || "")) ? u : "#";

function load() {
  try {
    const v = JSON.parse(localStorage.getItem(KEY) || "null");
    return Array.isArray(v) && v.length ? v : DEFAULT_GAMES;
  } catch { return DEFAULT_GAMES; }
}

function render(games) {
  grid.textContent = "";
  games.forEach((g, i) => {
    const a = document.createElement("a");
    a.className = "card";
    a.href = httpOnly(g.url);
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.style.setProperty("--c", g.color || PALETTE[i % PALETTE.length]);

    const icon = document.createElement("span");
    icon.className = "icon";
    icon.textContent = g.icon || "🎲";

    const name = document.createElement("span");
    name.className = "name";
    name.textContent = g.name || "Untitled";

    const desc = document.createElement("span");
    desc.className = "desc";
    desc.textContent = g.desc || "";

    const body = document.createElement("span");
    body.className = "body";
    body.append(name, desc);

    const go = document.createElement("span");
    go.className = "go";
    go.textContent = "→";

    a.append(icon, body, go);
    grid.append(a);
  });
  $("#count").textContent = games.length;
}

const ta = $("#json"), panel = $("#panel"), status = $("#status");
const say = (msg, bad) => { status.textContent = msg; status.dataset.bad = bad ? "1" : ""; };

$("#editBtn").onclick = () => {
  panel.hidden = !panel.hidden;
  if (!panel.hidden) { ta.value = JSON.stringify(load(), null, 2); say(""); ta.focus(); }
};
$("#save").onclick = () => {
  let v;
  try { v = JSON.parse(ta.value); } catch { return say("Not valid JSON", true); }
  if (!Array.isArray(v)) return say("Expected a JSON array", true);
  localStorage.setItem(KEY, JSON.stringify(v));
  render(v);
  say("Saved — " + v.length + " games");
};
$("#copy").onclick = async () => {
  const text = JSON.stringify(load(), null, 2);
  try { await navigator.clipboard.writeText(text); say("Copied — send it to a friend"); }
  catch { ta.select(); say("Press ⌘C / Ctrl+C to copy"); }
};
$("#reset").onclick = () => {
  localStorage.removeItem(KEY);
  ta.value = JSON.stringify(DEFAULT_GAMES, null, 2);
  render(DEFAULT_GAMES);
  say("Back to the default list");
};

render(load());
</script>
</body>
</html>
